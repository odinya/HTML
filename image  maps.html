  <body>
    <h2>Choose the door game</h2>
    <p>Open the door to see what's waiting for you behind it.</p>
    <img
      src="https://edube.org/uploads/media/default/0001/03/choose-the-door.jpg"
      alt="A picture with two doors"
      usemap="#two-doors"
    />
    <map name="two-doors">
      <area
        shape="rect"
        title="A door with a white knob"
        coords="80,80,275,450"
        href="https://example.com/option1"
        alt="Open the door to Option 1"
      />
      <area
        shape="rect"
        title="A door with a black knob"
        coords="540,75,745,460"
        href="https://example.com/option2"
        alt="Open the door to Option 2"
      />
    </map>
    <!-- this sample, interactive game called "Choose the Door," 
     you can open the door to reveal what's hidden behind it. 
     The image displays two doors with different colored knobs. 
     Each door is a clickable hotspot. If you click on the door with the white knob, 
     it will open the door to Option 1, 
     which is represented by a specific URL. 
     On the other hand, if you click on the door with the black knob, 
     it will open the door to Option 2, which is also associated with a specific URL. 
     Take your pick and see what awaits you behind the doors! 
     Then, experiment with your own image map.
