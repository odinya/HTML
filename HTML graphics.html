<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <canvas id="myCanvas" width="300" height="200"></canvas>

    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "black";
      ctx.fillRect(100, 100, 200, 100);
    </script>
    <!--Here's what happens in the code:

The HTML code <canvas id="myCanvas" width="300" height="200"></canvas> 
creates a <canvas> element with an id attribute assigned the value of "myCanvas". 
    Additionally, it sets the width to 300 pixels and the height to 200 pixels, 
    which defines the dimensions of the canvas.
The <script> and </script> tags, without delving into specifics, 
enclose the JavaScript code section. Within this section, 
JavaScript fetches the canvas element and assigns it to the canvas variable. 
A 2D graphic context is created, specifically a black rectangle in this case, 
and then the shape is filled with the color black.-->
    <svg width="100" height="100">
      <circle cx="50" cy="50" r="40" fill="blue" />
    </svg>
    <!--Let's see what the code does:

The <svg> element defines the SVG container with a width and height of 100 units.
The <circle> element is used to draw a circle, with a center at coordinates (50, 50), 
a radius of 40 units, and a fill color of black. 
The result is a simple black circle displayed on the webpage.-->
  </body>
</html>
